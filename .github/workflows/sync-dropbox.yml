name: Sync Files from Dropbox

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC (~08:00 Rome)
  workflow_dispatch:

# We push with a PAT, so GITHUB_TOKEN can stay read-only
permissions:
  contents: read

# Prevent overlapping runs
concurrency:
  group: dropbox-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (main, with PAT)
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT }}   # PAT must have Contents: Read & write

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone qpdf file

      - name: Define Dropbox source path
        run: echo "SRC_PATH=Website/Documents" >> "$GITHUB_ENV"

      - name: Sync from Dropbox
        env:
          RCLONE_DROPBOX_TOKEN: ${{ secrets.DROPBOX_TOKEN_JSON }}
          RCLONE_DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID }}
          RCLONE_DROPBOX_CLIENT_SECRET: ${{ secrets.DROPBOX_CLIENT_SECRET }}
        run: |
          rclone sync ":dropbox:${SRC_PATH}" "./docs" --fast-list

      # Ensure PDFs are binary (no text filters/diffs)
      - name: Ensure .gitattributes for PDFs
        run: |
          {
            echo "*.pdf binary"
            echo "*.PDF binary"
          } > .gitattributes

      # DEBUG ONLY: collect why qpdf cannot create its output file.
      # Never fails the job, so the run stops at Normalise PDFs and pushes nothing.
      - name: Debug qpdf write failure
        run: |
          set +x
          echo "::group::identity and umask"; id; umask; echo "::endgroup::"
          echo "::group::folder and file permissions"
          stat -c '%A %U:%G %n' docs docs/CV docs/papers docs/policy_reports
          stat -c '%A %U:%G %n' docs/CV/*.pdf docs/papers/*.pdf docs/policy_reports/*.pdf
          findmnt -T docs/CV || true
          lsattr -d docs/CV docs/papers 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::write tests"
          touch docs/CV/_plain_write_test && echo "plain touch: ok" && rm -f docs/CV/_plain_write_test || echo "plain touch: FAILED"
          echo "::endgroup::"
          echo "::group::qpdf version and label"
          qpdf --version | head -1
          cat /proc/self/attr/current 2>/dev/null || echo "no LSM label for shell"
          echo; echo "::endgroup::"
          echo "::group::qpdf output variants"
          qpdf --linearize docs/CV/KimTaveras_CV.pdf "$RUNNER_TEMP/a.pdf"; echo "to temp dir with --linearize: exit $?"
          qpdf docs/CV/KimTaveras_CV.pdf "$RUNNER_TEMP/b.pdf"; echo "to temp dir without --linearize: exit $?"
          qpdf --linearize docs/CV/KimTaveras_CV.pdf "docs/CV/_c_test.pdf"; echo "same dir, other name: exit $?"
          qpdf --linearize docs/CV/KimTaveras_CV.pdf "docs/CV/_d_test.pdf.qpdf"; echo "same dir, .pdf.qpdf name: exit $?"
          rm -f docs/CV/_c_test.pdf docs/CV/_d_test.pdf.qpdf
          echo "::endgroup::"
          echo "::group::syscall trace (strace)"
          sudo apt-get install -y strace >/dev/null 2>&1 || echo "strace install failed"
          strace -f -e trace=openat,creat,rename -o "$RUNNER_TEMP/strace.txt" \
            qpdf --linearize docs/CV/KimTaveras_CV.pdf docs/CV/KimTaveras_CV.pdf.qpdf || true
          grep -E 'KimTaveras|EACCES|EPERM' "$RUNNER_TEMP/strace.txt" | tail -20 || true
          echo "::endgroup::"
          echo "::group::kernel and AppArmor denials"
          sudo dmesg 2>/dev/null | grep -i -E 'apparmor|denied' | tail -20 || echo "dmesg not readable"
          sudo aa-status 2>/dev/null | head -30 || echo "aa-status not available"
          echo "::endgroup::"
          exit 0

      # Normalise PDFs (optional but safe)
      - name: Normalise PDFs
        run: |
          shopt -s nullglob globstar
          for f in docs/**/*.pdf docs/*.pdf docs/**/*.PDF docs/*.PDF; do
            qpdf --linearize "$f" "$f.qpdf" && mv -f "$f.qpdf" "$f"
          done

      - name: Configure git author
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Stage and commit
        run: |
          git add -A docs .gitattributes
          git commit -m "Docs: Auto-sync from Dropbox" || echo "No changes to commit"

      # Pull remote changes first to avoid 'fetch first'
      - name: Rebase onto latest origin/main
        run: |
          git fetch origin main --depth=1
          git pull --rebase origin main || (echo "::error::Rebase failed (conflict). Resolve manually or switch to PR flow."; exit 1)

      - name: Push to main (with PAT)
        run: git push origin HEAD:main
